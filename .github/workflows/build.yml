name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_engine:
        description: "Ignore the cached engine AAR and rebuild it from source"
        type: boolean
        default: false

permissions:
  contents: write   # needed to create a GitHub Release

env:
  # Bump v1 -> v2 to force a fresh engine build. The engine AAR is cached between runs because the native
  # build is slow.
  ENGINE_CACHE_VERSION: v3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to tell which zip was committed last

      # Browsers rename a second download to "CalculatorApp_1.zip" and so on. Build whichever CalculatorApp*.zip was
      # committed most recently instead of insisting on one exact name, and say which one it was.
      - name: Unzip source
        run: |
          zip="$(git log --diff-filter=AM --name-only --format= -- 'CalculatorApp*.zip' | grep -m1 . || true)"
          [ -n "$zip" ] || zip=CalculatorApp.zip
          echo "Building from $zip (last changed in: $(git log -1 --format='%h %s' -- "$zip"))"
          echo "Built from \`$zip\`" >> "$GITHUB_STEP_SUMMARY"
          unzip -o "$zip" -d extracted
          mv extracted/CalculatorApp project

      # JDK 21: the engine's code is written for Java 21 (JDK 17 fails with "invalid source release: 21").
      # The app itself still compiles for Java 17, which JDK 21 handles.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner already has the Android SDK. Accepting the licences lets Gradle download whatever else the
      # engine and the app ask for (NDK, CMake, platforms).
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore engine AAR cache
        id: engine-cache
        if: ${{ !inputs.rebuild_engine }}
        uses: actions/cache@v4
        with:
          path: |
            project/app/libs/blackbox-core.aar
            project/app/libs/engine-dep-*
          key: engine-aar-${{ env.ENGINE_CACHE_VERSION }}-${{ hashFiles('project/scripts/*') }}

      - name: Build the hidden-app engine (BlackBox AAR)
        if: ${{ steps.engine-cache.outputs.cache-hit != 'true' }}
        run: |
          chmod +x project/scripts/build_engine.sh
          project/scripts/build_engine.sh

      - name: Check the engine AAR is in place
        run: |
          ls -l project/app/libs
          test -s project/app/libs/blackbox-core.aar

      # Keep the AAR for next time even if a later step fails.
      - name: Save engine AAR cache
        if: ${{ always() && steps.engine-cache.outputs.cache-hit != 'true' && hashFiles('project/app/libs/blackbox-core.aar') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            project/app/libs/blackbox-core.aar
            project/app/libs/engine-dep-*
          key: engine-aar-${{ env.ENGINE_CACHE_VERSION }}-${{ hashFiles('project/scripts/*') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Calculator.apk

      # Fail the run unless the engine really is inside the APK, so an APK without it can never be released.
      - name: Check the engine is inside the APK
        run: |
          if unzip -p Calculator.apk 'classes*.dex' | grep -aq 'top/niunaijun/blackbox/BlackBoxCore'; then
            echo "Engine included: yes" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "The engine classes are NOT in the APK" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # The engine crashes at start-up without its libraries (this is the NoClassDefFoundError seen in the app).
          if unzip -p Calculator.apk 'classes*.dex' | grep -aq 'top/niunaijun/blackreflection/BlackReflection'; then
            echo "Engine libraries (BlackReflection) included: yes" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "BlackReflection is NOT in the APK: the engine would fail to start" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: Calculator.apk
          if-no-files-found: error

      - name: Upload engine AAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-core-aar
          path: |
            project/app/libs/*.aar
            project/app/libs/*.jar
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Calculator.apk \
            --target "${{ github.sha }}" \
            --title "Calculator v1.0.${{ github.run_number }}" \
            --notes "Debug APK (with hidden-app engine) built automatically from commit ${{ github.sha }}."
