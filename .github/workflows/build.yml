name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_engine:
        description: "Ignore the cached engine AAR and rebuild it from source"
        type: boolean
        default: false

permissions:
  contents: write   # needed to create a GitHub Release

env:
  # Bump v1 -> v2 to force a fresh engine build. The engine AAR is cached between runs because the native
  # build is slow.
  ENGINE_CACHE_VERSION: v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o CalculatorApp.zip -d extracted
          mv extracted/CalculatorApp project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK. Accepting the licences lets Gradle download whatever else the
      # engine and the app ask for (NDK, CMake, platforms).
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore engine AAR cache
        id: engine-cache
        if: ${{ !inputs.rebuild_engine }}
        uses: actions/cache@v4
        with:
          path: project/app/libs/blackbox-core.aar
          key: engine-aar-${{ env.ENGINE_CACHE_VERSION }}-${{ hashFiles('project/scripts/build_engine.sh') }}

      - name: Build the hidden-app engine (BlackBox AAR)
        if: ${{ steps.engine-cache.outputs.cache-hit != 'true' }}
        run: |
          chmod +x project/scripts/build_engine.sh
          project/scripts/build_engine.sh

      - name: Check the engine AAR is in place
        run: |
          ls -l project/app/libs
          test -s project/app/libs/blackbox-core.aar

      # Keep the AAR for next time even if a later step fails.
      - name: Save engine AAR cache
        if: ${{ always() && steps.engine-cache.outputs.cache-hit != 'true' && hashFiles('project/app/libs/blackbox-core.aar') != '' }}
        uses: actions/cache/save@v4
        with:
          path: project/app/libs/blackbox-core.aar
          key: engine-aar-${{ env.ENGINE_CACHE_VERSION }}-${{ hashFiles('project/scripts/build_engine.sh') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Calculator.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: Calculator.apk
          if-no-files-found: error

      - name: Upload engine AAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-core-aar
          path: project/app/libs/blackbox-core.aar
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Calculator.apk \
            --target "${{ github.sha }}" \
            --title "Calculator v1.0.${{ github.run_number }}" \
            --notes "Debug APK (with hidden-app engine) built automatically from commit ${{ github.sha }}."
